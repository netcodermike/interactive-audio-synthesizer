<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patch Synth Playground</title>
<style>body{background:#101a25;color:#dcefe9;font:18px system-ui;max-width:900px;margin:8vh auto;padding:24px}h1{font-size:52px}.chain{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0}.node{padding:22px;border:1px solid #3cb89c;border-radius:12px;background:#182b37}label{display:block;margin:20px 0}input{width:60%}button,select{font:inherit;padding:12px;background:#88e1bb;border:0;border-radius:8px}canvas{background:#182b37;width:100%;height:150px}</style>
<h1>Patch Synth</h1><p>Shape a tone, then trace its signal.</p><div class="chain"><div class="node">Oscillator →</div><div class="node">Low-pass →</div><div class="node">Echo →</div><div class="node">Output</div></div>
<label>Waveform <select id="wave"><option>sine</option><option>square</option><option>sawtooth</option><option>triangle</option></select></label>
<label>Pitch <input id="pitch" type="range" min="40" max="1800" value="220"> <output id="pitchValue">220 Hz</output></label>
<label>Cutoff <input id="cutoff" type="range" min="40" max="12000" value="1600"> <output id="cutoffValue">1600 Hz</output></label>
<label>Echo <input id="echo" type="range" min="0" max="0.7" step="0.01" value="0.2"> <output id="echoValue">0.2</output></label>
<button id="play">Play</button> <button id="stop">Stop</button><p id="status" role="status">Audio starts only when you press Play.</p><canvas id="scope" width="850" height="150" aria-label="Audio waveform"></canvas>
<script>
let ctx,osc,filter,delay,feedback,gain,analyser;const el=id=>document.getElementById(id);
function update(){el('pitchValue').textContent=el('pitch').value+' Hz';el('cutoffValue').textContent=el('cutoff').value+' Hz';el('echoValue').textContent=el('echo').value;if(osc){osc.type=el('wave').value;osc.frequency.setTargetAtTime(+el('pitch').value,ctx.currentTime,.02);filter.frequency.setTargetAtTime(+el('cutoff').value,ctx.currentTime,.02);feedback.gain.setTargetAtTime(+el('echo').value,ctx.currentTime,.02);}}
function stop(){if(osc){gain.gain.setTargetAtTime(0,ctx.currentTime,.02);const old=osc;osc=null;setTimeout(()=>{old.stop();ctx.close();ctx=null;},160);el('play').disabled=true;setTimeout(()=>el('play').disabled=false,200);}el('status').textContent='Stopped.';}
el('play').onclick=async()=>{if(ctx)return;ctx=new AudioContext();await ctx.resume();osc=ctx.createOscillator();filter=ctx.createBiquadFilter();filter.type='lowpass';delay=ctx.createDelay(1);delay.delayTime.value=.25;feedback=ctx.createGain();gain=ctx.createGain();gain.gain.value=.12;analyser=ctx.createAnalyser();analyser.fftSize=1024;osc.connect(filter);filter.connect(gain);filter.connect(delay);delay.connect(feedback);feedback.connect(delay);feedback.connect(gain);gain.connect(analyser);analyser.connect(ctx.destination);update();osc.start();el('status').textContent='Playing. Adjust the controls to hear the signal change.';draw();};
function draw(){if(!ctx||!osc)return;const data=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(data);const c=el('scope').getContext('2d');c.clearRect(0,0,850,150);c.strokeStyle='#88e1bb';c.beginPath();data.forEach((v,i)=>{const x=i/data.length*850,y=v/255*150;i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();requestAnimationFrame(draw);}
el('stop').onclick=stop;['pitch','cutoff','echo','wave'].forEach(id=>el(id).oninput=update);window.addEventListener('pagehide',()=>{if(ctx)ctx.close();});
</script></html>
